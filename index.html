<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超かぐや姫（非公式）</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="header-inner">

        <img src="logo.png" alt="超かぐや姫 ロゴ" class="logo">

        <nav>
            <a href="#home">ホーム</a>
            <a href="#about">このサイトについて</a>
            <a href="#server">サーバー情報</a>
        </nav>

    </div>
</header>


<main>

    <!-- メイン -->

    <section id="home" class="hero">

        <div class="hero-content">

            <p class="subtitle">UNOFFICIAL FAN SITE</p>

            <h1>超かぐや姫</h1>

            <p>
                「超かぐや姫」ファンのための<br>
                非公式サイトです。
            </p>

            <a href="#server" class="button">
                サーバー情報を見る
            </a>

        </div>

    </section>


    <!-- このサイトについて -->

    <section id="about" class="section">

        <p class="section-label">ABOUT</p>

        <h2>このサイトについて</h2>

        <div class="card">

            <p>
                このサイトは「超かぐや姫」に関する情報を
                まとめた非公式ファンサイトです。
            </p>

            <p>
                最新情報やサーバーに関する情報などを
                分かりやすく紹介していきます。
            </p>

        </div>

    </section>


    <!-- サーバー情報 -->

    <section id="server" class="section">

        <p class="section-label">SERVER</p>

        <h2>サーバー情報</h2>

        <div class="server-card">

            <div class="server-icon">

                <img src="logo.png" alt="サーバーロゴ">

            </div>

            <div class="server-info">

                <h3>超かぐや姫（非公式）</h3>

                <p>
                    <span>鯖主</span>
                    taburu
                </p>

                <p>
                    超かぐや姫のファン向けサーバーです。
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <p>© 超かぐや姫（非公式）</p>

    <p>
        このサイトは非公式のファンサイトです。
    </p>

</footer>

</body>
</html>
